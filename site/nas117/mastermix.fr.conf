# Vhost mastermix.fr — relais TLS vers le site statique hébergé sur .166:8095.
# Fichier autonome, inclus depuis /etc/nginx/nginx.conf. Ne touche à aucun
# autre vhost (karalook.org, karakal.media, mail.besancon.vip).

server {
    listen 80;
    listen [::]:80;
    server_name mastermix.fr www.mastermix.fr;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/acme;
        default_type "text/plain";
    }

    location / { return 301 https://$host$request_uri; }
}

# www -> apex, en HTTPS, une seule adresse canonique.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.mastermix.fr;

    ssl_certificate     /root/mastermix/certs/mastermix.fr.fullchain.pem;
    ssl_certificate_key /root/mastermix/certs/mastermix.fr.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:mastermix_ssl:10m;
    ssl_session_timeout 1d;

    return 301 https://mastermix.fr$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name mastermix.fr;

    ssl_certificate     /root/mastermix/certs/mastermix.fr.fullchain.pem;
    ssl_certificate_key /root/mastermix/certs/mastermix.fr.key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:mastermix_ssl:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=15552000" always;

    # Téléversements de l'admin par morceaux de 1 Mo (+ en-têtes) ; envois de courrier en JSON jusqu'à 30 Mo.
    client_max_body_size 32m;

    location / {
        proxy_pass http://192.168.1.166:8095;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # Installeurs de 65 à 100 Mo : streaming sans tampon disque, reprise Range.
        proxy_buffering off;
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_read_timeout 600;
    }
}
