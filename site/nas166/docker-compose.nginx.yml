# Ancien service statique (rollback) : `docker compose -f docker-compose.nginx.yml up -d`
# après `docker compose down`. Sert www/ tel quel, sans admin ni courrier.
services:
  web:
    image: nginx:1.27-alpine
    container_name: mastermix-site
    restart: unless-stopped
    ports:
      - "192.168.1.166:8095:80"
    volumes:
      - /mnt/karakalia/mastermix-site/www:/usr/share/nginx/html:ro
      - /mnt/karakalia/mastermix-site/nginx.conf:/etc/nginx/conf.d/default.conf:ro
