# Site statique mastermix.fr — servi par le conteneur mastermix-site sur .166:8095.
# Le TLS et le nom public sont gérés par le nginx de .117 (relais).

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # Réponse de santé pour le relais et la supervision.
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # Installeurs : pas de listing, envoi en fichier, reprise de téléchargement.
    location /telechargements/ {
        autoindex off;
        add_header Content-Disposition 'attachment';
        add_header Cache-Control "public, max-age=3600";
        types {
            application/octet-stream exe zip;
            text/plain txt;
        }
    }

    location = /logo.svg { add_header Cache-Control "public, max-age=86400"; }

    location / {
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300";
    }
}
